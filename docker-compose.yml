services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthcare_app}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-healthcare}
      FHIR_BASE_URL: http://fhir:8080/fhir
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [healthcare-net]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthcare-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [healthcare-net]

  fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: healthcare-fhir
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks: [healthcare-net]

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: healthcare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_local_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks: [healthcare-net]

volumes:
  postgres_data:
  minio_data:

networks:
  healthcare-net:
    name: healthcare-net
    driver: bridge

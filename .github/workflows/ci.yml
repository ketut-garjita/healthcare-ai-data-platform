name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Start PostgreSQL, HAPI FHIR, and Silo
        run: docker compose up -d postgres fhir minio

      - name: Wait for integration services
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/fhir/metadata >/dev/null \
              && docker compose exec -T postgres pg_isready -U healthcare_app -d healthcare \
              && curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 postgres fhir minio
          exit 1

      - name: Mandatory integration tests (skips fail the job)
        env:
          REQUIRE_INTEGRATION_SERVICES: "true"
        run: uv run pytest -q -ra tests/integration
